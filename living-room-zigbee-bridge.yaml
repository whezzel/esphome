text_sensor:
  - platform: template
    id: serial_server_status
    name: Serial Server Status

  - platform: template
    id: zigbee_latest_firmware
    name: Zigbee - Latest Firmware
    
  - platform: template
    id: manufacturer_string
    name: Zigbee - MFG String
    internal: true

  - platform: template
    id: board_name
    name: Zigbee - Board Name
    internal: true

  - platform: template
    id: zigbee_info_status
    name: Zigbee - Info Status

  - platform: template
    id: zigbee_ieee
    name: Zigbee - IEEE Address
    internal: true

  - platform: template
    id: zigbee_firmware
    name: Zigbee - Current FW Version

efr32_flasher:
  id: zigbee_efr32_flasher
  uart_id: uart_bus
  url: "https://github.com/tube0013/tube_gateways/raw/refs/heads/main/misc/efr32manifest.json"
  boot_switch: zigbee_bsl_gpio
  rst_switch: zigbee_rst_gpio
  busy_binary_sensor: ncp_busy
  show_progress: true
  progress_step: 5
  variant: auto
  board_name_text: board_name
  mfg_string_text: manufacturer_string
  latest_fw_version_text: zigbee_latest_firmware
  bootloader_baud_rate: 115200

efr32_info:
  id: zigbee_info
  uart_id: uart_bus
  stream_server_id: serial_stream_server
  busy_binary_sensor: ncp_busy
  status_text: zigbee_info_status
  manufacturer_text: manufacturer_string
  board_name_text: board_name
  firmware_text: zigbee_firmware
  ieee_text: zigbee_ieee
  raw_capture: true

script:
  - id: firmware_update_mode
    then:
      - switch.turn_on: zigbee_bsl_gpio
      - delay: 1s
      - switch.turn_on: zigbee_rst_gpio
      - delay: 1s
      - switch.turn_off: zigbee_rst_gpio
      - delay: 1s
      - switch.turn_off: zigbee_bsl_gpio
  - id: boot_probe_sequence
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(boot_probe_done);'
          then:
            - logger.log:
                format: Boot probe skipped (already executed)
                level: DEBUG
          else:
            - delay: 2s
            - efr32_info.probe: { id: zigbee_info }
            - wait_until:
                condition:
                  lambda: 'if (id(ncp_busy).state) App.feed_wdt(); return !id(ncp_busy).state;'
                timeout: 45s
            - delay: 500ms
            - if:
                condition:
                  lambda: 'return id(board_name).state.empty();'
                then:
                  - logger.log:
                      format: Boot probe completed but board name sensor still empty
                      level: WARN
            - efr32_flasher.check_update: { id: zigbee_efr32_flasher }
            - lambda: 'id(boot_probe_done) = true;'
