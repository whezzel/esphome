substitutions:
  api_key: !secret bedroom-1-bed_api_key
  board: wemos_d1_mini32
  device: Bed
  devicename: bedroom-1-bed
  framework: esp-idf
  log_level: DEBUG
  room: Bedroom 1
  update_interval: .1s

packages:
  api: !include /config/common/api.yaml
  binary_sensor: !include /config/common/binary_sensor.yaml
  esp32_ble_tracker: !include /config/common/esp32_ble_tracker.yaml
  esp32: !include /config/common/esp32.yaml
  esphome: !include /config/common/esphome.yaml
  logger: !include /config/common/logger.yaml
#  network: !include /config/common/network.yaml
  ota: !include /config/common/ota.yaml
  sensor: !include /config/common/sensor.yaml
  switch: !include /config/common/switch.yaml
  text_sensor: !include /config/common/text_sensor.yaml
  time: !include /config/common/time.yaml
  web_server: !include /config/common/web_server.yaml
  wifi: !include /config/common/wifi.yaml

status_led:
  pin:
    number: 2
    inverted: true
    ignore_strapping_warning: true

globals:
  - id: bed_occupied_state
    type: bool
    restore_value: yes
    initial_value: 'false'

binary_sensor:
  - platform: template
    name: Occupancy
    id: bed_occupancy
    icon: mdi:bed
    device_class: occupancy
    lambda: |-
      if (id(change).has_state() && id(std_dev).has_state()) {
        float change_val = id(change).state;
        float stddev_val = id(std_dev).state;
        if (stddev_val >= 0.12) {
          if (change_val <= -0.30) {
            id(bed_occupied_state) = true;
            return true;
          } else if (change_val >= 0.30) {
            id(bed_occupied_state) = false;
            return false;
          }
        }
      }
      return id(bed_occupied_state);

sensor:
  - platform: adc
    pin:
      number: 34
    name: ADC
    update_interval: ${update_interval}
    accuracy_decimals: 5
    id: bed_adc
    internal: true
    attenuation: auto
    filters:
      - exponential_moving_average:
          send_every: 1
          alpha: 0.1
          send_first_at: 1

  - platform: copy
    source_id: bed_adc
    name: Standard Deviation
    id: std_dev
    #internal: true
    unit_of_measurement: V
    accuracy_decimals: 5
    device_class: voltage
    state_class: measurement
    filters:
      - lambda: |-
          const uint16_t WINDOW_SIZE = 200;
          static float buffer[WINDOW_SIZE] = {0.0f};
          static uint16_t pos = 0;
          static uint16_t filled = 0;

          buffer[pos] = x;
          pos = (pos + 1) % WINDOW_SIZE;
          if (filled < WINDOW_SIZE) filled++;

          if (filled < 2) return NAN;

          uint16_t n = filled;
          float sum = 0.0f;
          float sum_sq = 0.0f;
          for (uint16_t i = 0; i < n; ++i) {
            float v = buffer[i];
            sum += v;
            sum_sq += v * v;
          }
          float mean = sum / n;
          float variance = (sum_sq - sum * mean) / (n - 1.0f);
          return sqrtf(variance);

  - platform: copy
    source_id: bed_adc
    name: Change
    id: change
    #internal: true
    unit_of_measurement: V
    accuracy_decimals: 5
    device_class: voltage
    state_class: measurement
    filters:
      - lambda: |-
          const uint16_t WINDOW_SIZE = 200;
          static float buffer[WINDOW_SIZE] = {0.0f};
          static uint16_t pos = 0;
          static uint16_t filled = 0;

          buffer[pos] = x;
          uint16_t old_pos = pos;
          pos = (pos + 1) % WINDOW_SIZE;
          if (filled < WINDOW_SIZE) filled++;

          if (filled < 2) return NAN;

          float oldest;
          if (filled < WINDOW_SIZE) {
            oldest = buffer[0];
          } else {
            oldest = buffer[pos];
          }
          return x - oldest;
